name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Test dependency of THIS repo's own checks (contract validator, YAML
      # parsing) on an ephemeral runner — never installed into a consumer's
      # environment. See AGENTS.md, Tooling Policy.
      - name: Install check dependencies
        run: pip install pyyaml

      - name: Fast checks (refs, contract, bindings, detectors, manifests, scripts)
        run: bash scripts/run_checks.sh

      - name: Verify plugin layout (commands and skills at plugin root)
        run: |
          test -f .claude-plugin/plugin.json
          ls commands/*.md >/dev/null
          for s in securability-engineering securability-engineering-review prd-securability-enhancement fiasse-lookup; do
            test -f "skills/$s/SKILL.md"
          done
          echo "plugin layout ok"

  opengrep-pack:
    runs-on: ubuntu-latest
    env:
      OPENGREP_VERSION: v1.27.1
      OPENGREP_SHA256: 58053da76672bbeb5b0a5441021c58338707052e10f81d777140ca879bd491ce
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Test dependency of THIS repo's own rule pack: a shipped pack CI cannot
      # execute would be untested text. Pinned + checksum-verified, on an
      # ephemeral runner only — the plugin's runtime never installs scanners
      # into a user's project (see AGENTS.md, Tooling Policy).
      - name: Install opengrep (pinned release, checksum-verified)
        run: |
          curl -fsSL -o opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  opengrep" | sha256sum -c -
          chmod +x opengrep
          sudo mv opengrep /usr/local/bin/opengrep
          opengrep --version

      - name: Test the securable rule pack against its fixtures
        run: bash scripts/test_opengrep_rules.sh
